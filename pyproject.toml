[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xingyu-mac-video-toolkit"
version = "0.1.0"
description = "Privacy-aware diagnostics for ComfyUI workflows and local video outputs on Mac"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "XINGYU"}]
keywords = ["comfyui", "apple-silicon", "video", "ffprobe", "workflow"]

[project.scripts]
xingyu-video = "xingyu_video_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
